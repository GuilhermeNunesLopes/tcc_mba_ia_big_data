apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-log-app
  labels:
    app: chaos-log-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-log-app
  template:
    metadata:
      labels:
        app: chaos-log-app
    spec:
      containers:
      - name: python-app
        image: chaos-log-app:latest
        # Never = usa a imagem buildada localmente no Minikube (IfNotPresent causava ErrImagePull)
        imagePullPolicy: Never
        ports:
        - containerPort: 8087
        workingDir: /app
        volumeMounts:
        - name: local-logs-volume
          mountPath: /app/logs
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8087
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: local-logs-volume
        hostPath:
          # Os logs ficam dentro da VM do Minikube em /tmp/chaos-log-app-logs
          # Para copiar para sua máquina Windows, use o comando abaixo:
          #   minikube ssh "cat /tmp/chaos-log-app-logs/app_operation.log"
          # Ou monte via: minikube mount F:/Guilherme/MBA\ Documentos/tcc_mba_ia_big_data/minikube/logs:/tmp/chaos-log-app-logs
          path: /tmp/chaos-log-app-logs
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-log-app-svc
  namespace: default
spec:
  selector:
    app: chaos-log-app
  ports:
  - port: 80
    targetPort: 8087
    nodePort: 30087
  type: NodePort
